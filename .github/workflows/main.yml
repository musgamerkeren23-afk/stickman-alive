name: Build Stickman Alive APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # SOLUSI UTAMA: Menggunakan Action Resmi Gradle untuk mengunci versi ke 8.4 secara paksa
    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    # Opsi tambahan untuk memastikan izin eksekusi aman jika file gradlew Anda ada di repositori
    - name: Grant Execute Permission for Gradlew
      run: |
        if [ -f gradlew ]; then
          chmod +x gradlew
        fi

    # Menjalankan build menggunakan versi yang sudah dikunci oleh setup-gradle di atas
    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Stickman-Alive-Release-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 7
