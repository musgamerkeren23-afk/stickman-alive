name: Build Stickman Alive APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # 1. Mengunci versi Gradle ke 8.4 (Sintaks sudah diperbaiki menjadi '-')
    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    # 2. Membuat file gradlew secara paksa langsung di folder utama (root)
    - name: Force Generate Gradle Wrapper
      run: |
        echo "🔧 Membuat Gradle wrapper bersih di root repositori..."
        gradle wrapper --gradle-version 8.4 --distribution-type bin
        chmod +x gradlew
      shell: bash

    # 3. Menyuntikkan konfigurasi AndroidX ke gradle.properties
    - name: Inject AndroidX Properties Configuration
      run: |
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
      shell: bash

    # 4. Membuat folder dan menyuntikkan file ikon default agar build AAPT tidak error
    - name: Auto-Generate Missing App Icons (Mipmap)
      run: |
        # Membuat folder res/mipmap jika belum ada di project app-mobile Anda
        mkdir -p app-mobile/src/main/res/mipmap-hdpi
        
        # Membuat gambar dummy xml kosong agar compiler (AAPT) sukses membaca file targetnya
        echo '<vector xmlns:android="http://android.com" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#3DDC84" android:pathData="M0,0h108v108H0z"/></vector>' > app-mobile/src/main/res/mipmap-hdpi/ic_launcher.xml
        echo '<vector xmlns:android="http://android.com" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#3DDC84" android:pathData="M0,0h108v108H0z"/></vector>' > app-mobile/src/main/res/mipmap-hdpi/ic_launcher_round.xml
        
        echo "✅ Sukses membuat file penambal ikon sistem!"
      shell: bash

    # 5. Menjalankan kompilasi APK langsung di root utama tempat project Anda berada
    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon

    # 6. Mengambil file APK dari folder mana pun di repositori Anda
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Stickman-Alive-Release-APK
        path: "**/build/outputs/apk/release/*.apk"
        retention-days: 7
