name: Build Stickman Alive APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # 1. Mengunci versi Gradle ke 8.4
    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    # 2. Membuat file gradlew secara paksa langsung di root
    - name: Force Generate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 8.4 --distribution-type bin
        chmod +x gradlew
      shell: bash

    # 3. Menyuntikkan konfigurasi AndroidX ke gradle.properties
    - name: Inject AndroidX Properties Configuration
      run: |
        echo "android.useAndroidX=true" >> gradle.properties
        echo "android.enableJetifier=true" >> gradle.properties
      shell: bash

    # 4. Membuat folder dan menyuntikkan file ikon dummy agar lolos AAPT
    - name: Auto-Generate Missing App Icons (Mipmap)
      run: |
        mkdir -p app-mobile/src/main/res/mipmap-hdpi
        echo '<vector xmlns:android="http://android.com" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#3DDC84" android:pathData="M0,0h108v108H0z"/></vector>' > app-mobile/src/main/res/mipmap-hdpi/ic_launcher.xml
        echo '<vector xmlns:android="http://android.com" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#3DDC84" android:pathData="M0,0h108v108H0z"/></vector>' > app-mobile/src/main/res/mipmap-hdpi/ic_launcher_round.xml
      shell: bash

    # 5. KUNCI UTAMA: Membuat file sertifikat Keystore fisik asli di root proyek sebelum dicompile
    - name: Generate Physical Keystore File
      run: |
        keytool -genkey -v -keystore release.keystore -alias stickman_key -keyalg RSA -keysize 2048 -validity 10000 -storepass stickman123 -keypass stickman123 -dname "CN=Stickman, OU=Alive, O=Dev, L=Jakarta, S=Indonesia, C=ID"
      shell: bash

    # 6. Menjalankan kompilasi APK (Otomatis ditandatangani oleh Gradle lewat konfigurasi Langkah 2)
    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon

    # 7. Mengambil file APK yang sudah 100% matang dan bersertifikat resmi
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Stickman-Alive-Signed-APK
        path: "**/build/outputs/apk/release/*-release.apk"
        retention-days: 7
