name: Build Stickman Alive APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # 1. Mengunci versi Gradle ke 8.4
    - name: Setup Gradle 8.4
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'

    # 2. Membuat file gradlew secara paksa langsung di folder utama (root)
    - name: Force Generate Gradle Wrapper
      run: |
        echo "🔧 Membuat Gradle wrapper bersih di root repositori..."
        gradle wrapper --gradle-version 8.4 --distribution-type bin
        chmod +x gradlew
      shell: bash

    # 3. Menjalankan kompilasi APK langsung di root utama tempat project Anda berada
    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon

    # 4. Mengambil file APK dari folder app-mobile atau app mana pun di repositori Anda
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Stickman-Alive-Release-APK
        path: "**/build/outputs/apk/release/*.apk"
        retention-days: 7
