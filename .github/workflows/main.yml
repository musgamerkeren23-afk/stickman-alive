name: Build Stickman Alive APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    # MODIFIKASI: Memaksa pembuatan wrapper ke versi 8.4 agar terhindar dari error Gradle 9+
    - name: Setup Compatible Gradle Wrapper
      run: gradle wrapper --gradle-version 8.4 --distribution-type bin

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    # Tambahan flags --no-daemon agar proses build di cloud lebih bersih dan hemat memori
    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Stickman-Alive-Release-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 7
