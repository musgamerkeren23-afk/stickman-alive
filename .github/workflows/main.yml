name: Build Stickman Alive APK

on:
  push:
    branches: [ "main" ] # Berjalan otomatis saat push ke branch main secara manual
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Memungkinkan Anda menjalankan build secara manual dari web GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: 'gradle'

    # Memberikan izin akses eksekusi script gradle lokal Anda
    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    # Mem-build aplikasi dari source code manual Anda menjadi APK Release
    - name: Build Release APK
      run: ./gradlew assembleRelease

    # Mengunggah APK mentah yang berhasil dicompile agar bisa didownload langsung
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Stickman-Alive-Release-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 7
